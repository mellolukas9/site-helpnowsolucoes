# Publica a versão de DEMONSTRAÇÃO (modo mock, noindex) no GitHub Pages.
# O site de produção continua sendo o conteúdo de public_html/ enviado à HostGator.
name: Demo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar a demo
        run: bash tools/build-pages-demo.sh "/${GITHUB_REPOSITORY#*/}" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
